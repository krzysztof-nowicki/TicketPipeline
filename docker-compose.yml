services:
  temporal:
    image: temporalio/temporal:latest
    container_name: temporal-server
    user: root
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-port", "8080", "--db-filename", "/data/temporal.db"]
    ports:
      - "7233:7233"
      - "8080:8080"
    volumes:
      - temporal-data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: northdesk-api
    ports:
      - "8001:8001"
    environment:
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=ticket-processing-queue
      - LLM_MODE=fake
      - ACTIVITYTOOLS_FAILURE_RATE=0.0
      - APP_HOST=0.0.0.0
      - APP_PORT=8001
      - LOG_LEVEL=INFO
    depends_on:
      - temporal
    command: ["python", "main.py", "--role", "api"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: northdesk-worker
    environment:
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=ticket-processing-queue
      - LLM_MODE=fake
      - ACTIVITYTOOLS_FAILURE_RATE=0.0
      - LOG_LEVEL=INFO
    depends_on:
      - temporal
    command: ["python", "main.py", "--role", "worker"]

volumes:
  temporal-data:
